[tool.poetry]
name = "src"
version = "0.1.0"
description = ""
authors = ["xanssun"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = "^0.115.4"
alembic = "^1.13.3"
sqlalchemy = "^2.0.36"
asyncpg = "^0.30.0"
pydantic-settings = "^2.6.1"
orjson = "^3.10.11"
uvicorn = "^0.32.0"
argon2-cffi = "^23.1.0"
certifi = "^2024.8.30"
aiohttp = "^3.10.10"
redis = "^5.2.0"
types-redis = "^4.6.0.20241004"
greenlet = "^3.1.1"
pyjwt = "^2.10.1"
aiohttp-socks = "^0.10.1"
aiogram = ">=3.14.0"
aiogram-dialog = "^2.4.0"
dishka = "^1.7.2"
curl-cffi = "^0.13.0"
taskiq = "^0.12.1"
taskiq-nats = "^0.6.0"
msgpack = "^1.1.2"
faststream = {extras = ["cli"], version = "0.5.48"}
python-multipart = "^0.0.22"
email-validator = "^2.3.0"


[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
pre-commit = "^4.0.1"


[tool.poetry.group.test.dependencies]
pytest = "^8.3.4"


[tool.poetry.group.dev.dependencies]
pytest-mock = "^3.15.1"
black = ">=25.1.0"
mypy = ">=1.16.1"
ruff = ">=0.12.0"


[tool.mypy]
# disable_error_code = ["union-attr", "var-annotated"]
warn_unused_ignores = false
follow_imports_for_stubs = true
pretty = true
show_absolute_path = true
hide_error_codes = false
show_error_context = true
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "msgpack"
ignore_missing_imports = true

[tool.ruff]
lint.ignore = ["E501", "B008", "C901", "W191", "UP007", "UP006", "UP035"]

lint.select = ["E", "W", "F", "I", "C", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:warnings"                      # Disabling warning capture entirely

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
